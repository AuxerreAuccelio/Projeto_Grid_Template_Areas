<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Grid Template Areas</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    
    <nav>
       <div class="container">
         <div>
            <img src="./assets/icons/messages.svg" alt="">
            <img src="./assets/icons/status.svg" alt="">
            <img src="./assets/icons/newsletter.svg" alt="">
            <img src="./assets/icons/community.svg" alt="">
        </div>
       </div>

      <div class="container">
          <div>
            <img src="./assets/icons/settings.svg" alt="">
            <img src="https://i.pravatar.cc/150?img=60" alt="">

        </div>
      </div>
    </nav>

    <section>
               
        <div class="container_conversa">
            
            <div class="pesquisa_agrupado">
                <div class="titulo_whatsapp">
                    <h3>WhatsApp</h3>
                </div>

                <div class="icones_whatsapp">
                    <img src="./assets/icons/new-chat.svg" alt="">
                    <img src="./assets/icons/more-settings.svg" alt="">
                </div>
            </div>

           
            </div>


            <form action="" class="pesquisa">

                <div class="campo_pesquisa">
                    <input class="input_pesquisa" type="text" placeholder="Pesquisar ou começar uma nova conversa">            
                </div>               
                
            </form>

            <div class="botoes_status_whatsapp">


                 <div class="status_whatsapp">
                    <p>Tudo</p>                    
            </div>

            <div class="status_whatsapp">
                <p>Não lidas</p>                    
            </div>

            <div class="status_whatsapp">
                <p>Favoritas</p>                    
            </div>

            <div class="status_whatsapp">
                <p>Grupos</p>
            </div>




            </div>

            
        </div>

        <div></div>

    </section>

    <main>
        <p>Main</p>
    </main>

</body>
</html>
